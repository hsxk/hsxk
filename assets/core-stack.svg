<svg xmlns="http://www.w3.org/2000/svg" width="470" height="330" viewBox="0 0 470 330" role="img" aria-labelledby="title desc">
  <title id="title">Engineering stack overview</title>
  <desc id="desc">Full-stack, data, AWS, cloud, and infrastructure engineering skills.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="0.5" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="468" height="328" rx="18" fill="#0d1117" stroke="#30363d"/>
  <text x="28" y="38" fill="#8b949e" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ENGINEERING STACK</text>
  <text x="28" y="68" fill="#f0f6fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">Full-stack × Data × Cloud</text>
  <rect x="28" y="80" width="190" height="3" rx="1.5" fill="url(#accent)"/>

  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="28" y="112" fill="#58a6ff" font-size="11" font-weight="700" letter-spacing="1">APP</text>
    <text x="92" y="112" fill="#f0f6fc" font-size="12.5" font-weight="600">TypeScript · React · Next.js · Python · Go · PHP</text>

    <line x1="28" y1="128" x2="442" y2="128" stroke="#21262d"/>

    <text x="28" y="154" fill="#3fb950" font-size="11" font-weight="700" letter-spacing="1">DATA</text>
    <text x="92" y="154" fill="#f0f6fc" font-size="12.5" font-weight="600">PostgreSQL · MySQL · Redis · BigQuery</text>
    <text x="92" y="174" fill="#8b949e" font-size="11.5">Airflow · XBRL · ETL / ELT · MinIO</text>

    <line x1="28" y1="192" x2="442" y2="192" stroke="#21262d"/>

    <text x="28" y="218" fill="#f0883e" font-size="11" font-weight="700" letter-spacing="1">AWS</text>
    <text x="92" y="218" fill="#f0f6fc" font-size="12.2" font-weight="600">ECS · ECR · EC2 · Lambda · EventBridge · API Gateway</text>
    <text x="92" y="238" fill="#8b949e" font-size="11.3">RDS · S3 · DynamoDB · VPC · IAM · CloudWatch · SQS / SNS</text>

    <line x1="28" y1="256" x2="442" y2="256" stroke="#21262d"/>

    <text x="28" y="282" fill="#a371f7" font-size="11" font-weight="700" letter-spacing="1">CLOUD</text>
    <text x="92" y="282" fill="#f0f6fc" font-size="12.2" font-weight="600">GCP · OCI · Cloudflare · Vercel</text>

    <text x="28" y="310" fill="#8b949e" font-size="11" font-weight="700" letter-spacing="1">SHIP</text>
    <text x="92" y="310" fill="#f0f6fc" font-size="12.2" font-weight="600">Docker · Nginx · GitHub Actions · GHCR · HTTP/2 / HTTP/3</text>
  </g>
</svg>